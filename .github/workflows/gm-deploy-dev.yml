name: GM Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Notify start (Telegram)
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🚀 GM dev build & deploy started: ${{ github.repository }} @ ${{ github.ref_name }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/light3739/somnia-mafia-gm-server:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          HOST="${{ secrets.MAFIATEST_SSH_HOST }}"
          if [ -z "$HOST" ]; then HOST="${{ secrets.GM_SSH_HOST }}"; fi
          PORT="${{ secrets.GM_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy to test server
        env:
          SSH_HOST: ${{ secrets.MAFIATEST_SSH_HOST }}
          SSH_USER: ${{ secrets.GM_SSH_USER }}
          SSH_PORT: ${{ secrets.GM_SSH_PORT }}
        run: |
          HOST="${SSH_HOST}"
          if [ -z "$HOST" ]; then HOST="${{ secrets.GM_SSH_HOST }}"; fi
          USER="${SSH_USER:-root}"
          PORT="${SSH_PORT:-22}"
          REMOTE_DIR="/root/mafia-dev/gm-server"
          FRONTEND_COMPOSE_DIR="/root/mafia-dev/frontend/ops/frontend-server"

          echo "[gm-dev:deploy] Rebuilding gm-server container via GHCR pull"
          DEPLOY_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
          DEPLOY_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

          ssh -p "$PORT" "${USER}@${HOST}" "
            set -euo pipefail
            cd '$FRONTEND_COMPOSE_DIR'

            if [ ! -f docker-compose.dev.yaml ]; then
              echo '[gm-dev:deploy] ERROR: docker-compose.dev.yaml not found at $FRONTEND_COMPOSE_DIR'
              exit 1
            fi

            docker compose --project-name mafia-dev -f docker-compose.dev.yaml pull gm-server
            docker compose --project-name mafia-dev -f docker-compose.dev.yaml up -d gm-server

            # Telegram notification from server (has bot token in env)
            ENV_FILE=/etc/mafia-monitor.env
            if [ -f \"\$ENV_FILE\" ]; then . \"\$ENV_FILE\"; fi
            BOT_TOKEN=\"\${TELEGRAM_BOT_TOKEN:-}\"
            CHAT_ID=\"\${TELEGRAM_CHAT_ID:-}\"
            if [ -n \"\$BOT_TOKEN\" ] && [ -n \"\$CHAT_ID\" ]; then
              curl -sS -X POST \"https://api.telegram.org/bot\${BOT_TOKEN}/sendMessage\" \
                -d \"chat_id=\${CHAT_ID}\" \
                --data-urlencode \"text=🧪 GM-server GHCR deployed\nBranch: $DEPLOY_BRANCH\nCommit: $DEPLOY_SHA\" \
                >/dev/null || true
            fi
          "

      - name: Notify success (Telegram)
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="✅ GM dev deploy success: ${{ github.repository }} @ ${{ github.ref_name }} | https://gm-test.mafiaonchain.live/health"
          fi

      - name: Notify failure (Telegram)
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="❌ GM dev deploy FAILED: ${{ github.repository }} @ ${{ github.ref_name }} | run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
